[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "F1EngineSimulator"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
